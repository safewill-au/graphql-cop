# ──────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "sonar-api-token"
description = "Uncovered a Sonar API token, potentially compromising software vulnerability scanning and code security."
regex = '''(?i)[\w.-]{0,50}?(?:sonar[_.-]?(login|token))(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}((?:squ_|sqp_|sqa_)?[a-z0-9=_\-]{40})(?:\\?['"\x60]|[\s;<>&)\]},]|\\[nr]|$)'''
secretGroup = 2
keywords = ["sonar"]

# ──────────────────────────────────────────────────────────────────────────────
# stripe-access-token
# ──────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "stripe-access-token"
description = "Found a Stripe Access Token, posing a risk to payment processing services and sensitive financial data."
regex = '''\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})'''
keywords = [
    "sk_test",
    "sk_live",
    "sk_prod",
    "rk_test",
    "rk_live",
    "rk_prod",
]
# Test-mode keys (sk_test_) are not real production credentials — suppressed here.
# No startsWith in the filter engine; use matchesAny with an anchored regex.
filter = '''
entropy(finding["secret"]) <= 2.0
|| matchesAny(finding["secret"], [r"""^sk_test_"""])
'''

