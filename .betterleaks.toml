# ──────────────────────────────────────────────────────────────────────────────
# aws-access-token
# ──────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "aws-access-token"
description = "Identified an AWS access key ID paired with a secret access key, which together can provide full access to AWS services."
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
keywords = [
    "a3t",
    "akia",
    "asia",
    "abia",
    "acca",
]
validate = '''
cel.bind(r,
  aws.validate(finding["secret"], captures["aws-secret-access-key"]),
  r.status == 200 ? {
    "result": "valid",
    "arn": r.arn,
    "account": r.account,
    "userid": r.userid
  } : r.status == 403 && r.error_code == "ExpiredToken" ? {
    "result": "revoked",
    "error_code": r.error_code,
    "error_message": r.error_message
  } : r.status == 403 ? {
    "result": "invalid",
    "error_code": r.error_code,
    "error_message": r.error_message
  } : unknown(r)
)

'''
filter = '''
entropy(finding["secret"]) <= 3.0
|| matchesAny(finding["secret"], [r""".+EXAMPLE$"""])
'''
