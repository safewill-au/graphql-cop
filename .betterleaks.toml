# ──────────────────────────────────────────────────────────────────────────────
# looker-client-id  (LOCAL OVERRIDE of the built-in rule)
# ──────────────────────────────────────────────────────────────────────────────
# regex/keywords reproduced verbatim from the betterleaks 1.4.1 built-in (local
# rules override built-ins entirely, so the whole rule must be restated).
# Local addition: the data team confirmed Looker *client IDs* are configuration
# identifiers, not secrets — they legitimately live in CI workflow files and
# Terraform variables and recur in new commits. The filter below suppresses every
# looker-client-id match. The sensitive half — the Looker *client secret* — is a
# separate rule (looker-client-secret) and is left fully active. Task 2-F / Q4.
[[rules]]
id = "looker-client-id"
description = "Found a Looker Client ID, risking unauthorized access to a Looker account and exposing sensitive data."
regex = '''(?i)[\w.-]{0,50}?(?:looker)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{20})(?:\\?['"\x60]|[\s;<>&)\]},]|\\[nr]|$)'''
keywords = ["looker"]
filter = '''
matchesAny(finding["match"], [r"""(?i)looker[_.\- ]?client[_.\- ]?id"""])
'''
