# ──────────────────────────────────────────────────────────────────────────────
# Global prefilter — runs before the (expensive) regex rules. Returns true (skip)
# for a path. Deliberately MINIMAL: we want as few blind spots as possible, so the
# only paths we skip are ones that genuinely cannot contain a reviewable text
# secret (binaries/images) or are not our code / placeholders by design:
#
#   - binary / image files            — not scannable text
#   - node_modules / vendor           — third-party code, never our secrets
#   - .env.example                    — placeholder values by design
#   - .betterleaks.toml               — the scanner's own ruleset; full of
#                                       secret-shaped regex by design, so scanning
#                                       it for secrets only ever false-positives
#
# NOT skipped (intentionally — these were exemptions in the source config we chose
# to drop so the scanner stays honest):
#   - READMEs / docs   — real tokens get pasted into docs; scan them.
#   - test/spec files  — a spec can grow a real secret; scan them. Suppress proven
#                        fake fixtures with an inline `betterleaks:allow` comment or
#                        a narrow .betterleaksignore fingerprint instead.
#   - app config files — rely on the rule-level allowlists + entropy filters; add a
#                        scoped exemption only for a *proven* false positive.
# ──────────────────────────────────────────────────────────────────────────────
prefilter = '''
filter.matchesAny(attributes[?"path"].orValue(""), [
  r"""(?i)\.(?:bmp|gif|jpe?g|png|svg|tiff|pdf|exe)$""",
  r"""(?:^|/)node_modules(?:/.*)?$""",
  r"""(?:^|/)vendor(?:/.*)?$""",
  r"""(?:^|/)\.env\.example$""",
  r"""(?:^|/)\.betterleaks\.toml$"""
])
'''

