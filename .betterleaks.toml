# ──────────────────────────────────────────────────────────────────────────────
# Full built-in definition copied verbatim from the betterleaks 1.4.1 embedded
# default config (extracted from /opt/homebrew/bin/betterleaks). Local rules
# override built-in rules entirely, so the whole rule must be reproduced here.
# Local addition: the final filter clause suppresses identifier variables
# (_CAMPAIGN_ID, _ROLE_ID, _CLIENT_ID, _ACCOUNT_ID, _PROJECT_ID) — Auth0 client
# and role IDs and Braze campaign IDs are configuration identifiers, not secrets.
[[rules]]
id = "generic-api-key"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:\\?['"\x60]|[\s;<>&)\]},]|\\[nr]|$)'''
