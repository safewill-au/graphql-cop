repos:
  # betterleaks secret scan — blocks secrets in the staged diff (see README → Secret scanning).
  - repo: local
    hooks:
      - id: betterleaks
        name: betterleaks (block secrets)
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'command -v betterleaks >/dev/null 2>&1 || { echo "⚠️  betterleaks not installed — skipping (brew install betterleaks); CI still scans."; exit 0; };
          betterleaks git --staged --redact --no-banner -c .betterleaks.toml || { echo;
          echo "❌ betterleaks: potential secret in staged changes — commit blocked.";
          echo "   • Real secret → remove it and rotate if it was ever pushed (Github secrets / GCP SecretManager).";
          echo "   • False positive → inline betterleaks:allow comment, else a fingerprint in .betterleaksignore (see README).";
          exit 1; }'
