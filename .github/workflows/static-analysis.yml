# Static analysis for graphql-cop.
#
# Two independent scans, both driven only by the auto-injected GITHUB_TOKEN
# (no org/repo secrets — required because this is a public fork):
#   1. codeql            — SAST over the Python source
#   2. docker-image-scan — build the image, scan OS packages + Python deps with Trivy
#
# All actions are pinned to full commit SHAs and are GitHub-owned or from a
# verified creator (aquasecurity), per the repo's Actions ruleset. Dependabot
# (github-actions ecosystem, configured in .github/dependabot.yml) keeps the
# pins current.
#
# Fork caveat: on pull_request from an outside fork, GitHub forces GITHUB_TOKEN
# read-only, so `security-events: write` is NOT granted. The scans still run as
# checks, but SARIF upload to the Security tab is skipped for those runs (the
# upload steps are guarded to same-repo events so they don't hard-fail).
name: static-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a code change.
    - cron: '17 4 * * 1'

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload code-scanning results (same-repo runs only)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: python
          queries: security-and-quality

      # Python is interpreted — no build step; analyze the source directly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: /language:python

  docker-image-scan:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF (same-repo runs only)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Build locally so we scan exactly what this repo's Dockerfile produces.
      - name: Build image
        run: docker build -t graphql-cop:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: graphql-cop:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Report only — don't fail the check on findings yet. Flip to a
          # non-zero exit-code once the team has triaged the baseline.
          exit-code: '0'
          ignore-unfixed: true

      # Only same-repo events get security-events:write; fork PRs would 403 here.
      - name: Upload Trivy SARIF
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
